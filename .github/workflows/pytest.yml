name: pytest

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          # - "3.11"
          # - "3.12"
          # - "3.13"
          # - "3.14"
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --frozen --python python --no-dev --no-managed-python --group tests

      - name: Run api tests
        env:
          DISKCACHE_ROOT: /tmp
        run: uv run --no-sync pytest -q --tb=short --disable-warnings --color=yes --maxfail=5 tests/api

      - name: Download pipelines data
        env:
          DISKCACHE_ROOT: /tmp
        run: uv run --no-sync pipeline-download

      - name: Run pipeline tests
        env:
          DISKCACHE_ROOT: /tmp
        run: uv run --no-sync pytest -q --tb=short --disable-warnings --color=yes --maxfail=5 tests/integration/pipelines
