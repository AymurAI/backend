experiment:
  name: "entity-disambiguation"
  run_name: "{model}-{system_id}-{user_id}-{timestamp}"

model:
  provider: "ollama"
  name: "llama3:8b"
  temperature: 0.2
  max_tokens: 512

prompts:
  system:
    id: "sys-001"
    text: ""
  user:
    id: "user-001"
    text: ""


data:
  ground_truth_dir: "/data/gt"
  input_dir: "/data/input"
  dataset_id: "gt-v1"
  manifest:
    enabled: true
    mode: "metadata_only"

predictions:
  output_base_dir: "/data/preds"
  dir_name_template: "preds-{model}-{system_id}-{user_id}-{timestamp}"

logging:
  mlflow:
    experiment_name: "entity-disambiguation"
  privacy:
    log_prompt_text: true
    log_data_manifest: false
    log_per_doc_scores: true
  per_doc_scores:
    id_strategy: "anon_filename"

evaluation:
  function: "evaluate_disambiguation"
  weights:
    w_ent: 0.4
    w_alias: 0.35
    w_label: 0.2
    w_role: 0.05
  per_doc_scores: true
  normalize: true
