services:
    aymurai-api:
        image: ghcr.io/aymurai/api:latest
        ports:
            - "8899:8899"
        depends_on:
            - ollama
        build:
            context: .
            dockerfile: ./docker/api/Dockerfile
            target: aymurai-api
        env_file:
            - .env
            - .env.common
        environment:
            OLLAMA_HOST: http://ollama:11434
        volumes:
            - ./resources/cache:/resources/cache

    aymurai-api-full:
        image: ghcr.io/aymurai/api:full
        ports:
            - "8899:8899"
        depends_on:
            - ollama
        build:
            context: .
            dockerfile: ./docker/api/Dockerfile
            target: aymurai-api-full
        restart: always
        environment:
            OLLAMA_HOST: http://ollama:11434
        deploy:
            resources:
                limits:
                    memory: 4g
                    cpus: "4.0"

    ollama:
        image: ollama/ollama
        container_name: ollama
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        ports:
            - "11434:11434"
        volumes:
            - ollama:/root/.ollama
        restart: always

volumes:
    ollama:
