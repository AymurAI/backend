examples:
- text: El 5 de mayo de 2023 el señor Fiscal indicó que realizó distintas medidas
    de prueba y que del resultado surge que tanto la investigada como el menor Juan
    Pérez se domicilian en la calle Sarmiento 1234, de la localidad de Moreno, por
    lo que solicitó que se declare la incompetencia en razón del territorio y se envíe
    el caso al Juzgado de Garantías que corresponda del Departamento Judicial de Moreno,
    con jurisdicción en el partido de Moreno.
  extractions:
  - extraction_class: FECHA
    extraction_text: 5 de mayo de 2023
  - extraction_class: PER
    extraction_text: Juan Pérez
  - extraction_class: DIRECCION
    extraction_text: Sarmiento 1234
  - extraction_class: LOC
    extraction_text: Moreno

- text: 'JUZGADO DE 1RA INSTANCIA EN LO PENAL CONTRAVENCIONAL Y DE FALTAS N°10 SECRETARIA
    N°19

    Carlos Gómez sobre 84 - HOMICIDIO CULPOSO Y OTROS

    Número: 52345/2022

    CUIJ: 12-34567890-1

    Actuación Nro: 2022-009876'
  extractions:
  - extraction_class: PER
    extraction_text: Carlos Gómez
  - extraction_class: NUM_EXPEDIENTE
    extraction_text: 52345/2022
  - extraction_class: CUIJ
    extraction_text: 12-34567890-1
  - extraction_class: NUM_ACTUACION
    extraction_text: 2022-009876

- text: 'Acusado: Miguel Torres, DNI 30123456, nacido el 14/02/1990, de 34 años de
    edad, de nacionalidad paraguaya, género varón cis, con estudios secundarios completos,
    hizo hasta 3er año porque fue padre joven, con último domicilio en Av. Corrientes
    3456, de esta ciudad, donde vive con su hermana y su cuñado Jorge Pérez. Tiene
    dos hijos a su cargo, de 5 y 8 años. Su hijo de 8 vive con él, su hija de 5 vive
    con su madre, Laura Fernández.'
  extractions:
  - extraction_class: PER
    extraction_text: Miguel Torres
  - extraction_class: DNI
    extraction_text: '30123456'
  - extraction_class: FECHA
    extraction_text: 14/02/1990
  - extraction_class: EDAD
    extraction_text: '34'
  - extraction_class: NACIONALIDAD
    extraction_text: paraguaya
  - extraction_class: ESTUDIOS
    extraction_text: estudios secundarios completos
  - extraction_class: DIRECCION
    extraction_text: Av. Corrientes 3456
  - extraction_class: PER
    extraction_text: Jorge Pérez
  - extraction_class: EDAD
    extraction_text: '5'
  - extraction_class: EDAD
    extraction_text: '8'
  - extraction_class: PER
    extraction_text: Laura Fernández

- text: 'El testigo Juan López dejó asentado su número de contacto: 11-2345-6789.
    Indicó que la médica Dra. Ana García, MN 12345, asistió al lugar donde se hallaba
    un vehículo Volkswagen, patente AB123CD.'
  extractions:
  - extraction_class: PER
    extraction_text: Juan López
  - extraction_class: TELEFONO
    extraction_text: 11-2345-6789
  - extraction_class: PER
    extraction_text: Ana García
  - extraction_class: NUM_MATRICULA
    extraction_text: '12345'
  - extraction_class: MARCA_AUTOMOVIL
    extraction_text: Volkswagen
  - extraction_class: PATENTE_DOMINIO
    extraction_text: AB123CD

- text: 'Se identificó una transferencia bancaria con los siguientes datos: CUIT 20-12345678-3,
    CBU 2850590940090412345671, Caja de Ahorro N° 12345678, Banco Nación.'
  extractions:
  - extraction_class: CUIT_CUIL
    extraction_text: 20-12345678-3
  - extraction_class: CBU
    extraction_text: '2850590940090412345671'
  - extraction_class: NUM_CAJA_AHORRO
