- text: Para mayor información, comunicarse a fiscalia.central@justicia.gob.ar o visitar
    el sitio https://justicia.gob.ar/actuaciones.
  extractions:
  - extraction_class: CORREO_ELECTRONICO
    extraction_text: fiscalia.central@justicia.gob.ar
  - extraction_class: LINK
    extraction_text: https://justicia.gob.ar/actuaciones

- text: En la Ciudad Autónoma de Buenos Aires, el día 5 de mayo de 2023, el Sr. Fiscal
    hace saber que Juan Pérez se domicilia en la calle Sarmiento 1234, localidad de
    Moreno.
  extractions:
  - extraction_class: FECHA
    extraction_text: 5 de mayo de 2023
  - extraction_class: PER
    extraction_text: Juan Pérez
  - extraction_class: DIRECCION
    extraction_text: Sarmiento 1234
  - extraction_class: LOC
    extraction_text: Moreno

- text: Por otra parte, la División Investigaciones Judiciales de la Policía Federal
    Argentina informó que no se dio intervención a ninguna otra Fiscalía u otro Juzgado
    por la sustracción del vehículo Volkswagen Voyage, dominio KXY-876
  extractions:
  - extraction_class: MARCA_AUTOMOVIL
    extraction_text: Volkswagen Voyage
  - extraction_class: PATENTE_DOMINIO
    extraction_text: KXY-876

- text: A su vez, requirió informes al Banco BBVA Francés, respecto de las cuentas
    bancarias de la denunciante, Carla Alejandra Garcia, D.N.I. 36.998.621 identificadas
    como Caja de ahorro en pesos argentinos número 117-59824/6 con CBU 0180132640000004685591
    y Caja de ahorro en dólares número 119-619018/2 con CBU 0170115544000062081822.
  extractions:
