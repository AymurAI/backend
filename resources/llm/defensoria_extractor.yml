output-format:
  type: json
  schema:
    numero_recomendacion: <NUM/AÑO o null>
    fecha_recomendacion: <DD de mes de YYYY o null>
    destinatarios:
    - nombre: <nombre propio o denominacion institucional, NUNCA un cargo>
      cargo: <cargo/función formal o null, NUNCA un nombre propio>
      destinatario_principal: <true o false>
      sector: <GCBA, Organismos Nacionales, Obra Social / Prepaga, Empresa o null>
    tema: <tema de la taxonomía o null>
    subtema: <subtema de la taxonomía o null>
    datos_personales: <true o false>
    contenido_para_publicar: <síntesis 1-2 líneas>
