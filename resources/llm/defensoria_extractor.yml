  \ impositivas\n  - Gestión de elementos ortopédicos y prestaciones de salud (COPIDIS\
  \ y Prog. Federal Incluir Salud)\n  - Pensiones no contributivas. Certificado médico\
  \ oficial\n  - Reclamos de personas con CUD a obras sociales y empresas de medicina\
  \ prepaga\n- AMBIENTE y CAMBIO CLIMÁTICO:\n  - ACUMAR. Seguimiento de Plan Integral\
  \ de Saneamiento\n  - Cambio climático. Energías renovables y eficiencia energética\n\
  \  - Cementerio de Autos\n  - Contaminación Sonora\n  - Contaminación con efluentes\
  \ líquidos, emanaciones y olores nauseabundos\n  - Evaluación de Impacto y Seguro\
  \ Ambiental\n  - Inundaciones\n  - Manejo de sustancias peligrosas\n  - Restauración\
  \ ecológica y reservas\n  - Reciclado y recuperación de residuos domicialiarios\n\
  \  - Residuos peligrosos y patogénicos\n  - Ruidos molestos (fuente no difusa)\n\
  \  - Fauna urbana (silvestre y sinantrópica)\n  - Animales de compañía. Tenencia\
