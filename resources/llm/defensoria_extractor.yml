system-prompts:
  information-extraction: Eres un asistente especializado en el análisis de documentos
    de la Defensoría del Pueblo. Tu tarea es extraer información clave del documento
    recibido y generar una síntesis muy concisa.
  extraction-guidelines: |
    Reglas de extracción y priorización:
    1. Extrae destinatarios como una lista de objetos con: nombre, cargo, destinatario_principal y sector.
    2. `destinatario_principal=true` cuando la medida (recomendación/exhortación/intimación) se dirige directamente a ese destinatario.
    3. `destinatario_principal=false` cuando la mención sea solo de notificación/comunicación ("notificar", "poner en conocimiento", "remitir copia").
    4. Prioriza la sección RESUELVE y verbos directivos como "recomendar", "exhortar", "instar", "intimar" para identificar destinatarios principales.
    5. `nombre` es siempre un nombre propio de persona o una denominación institucional. Nunca describe un rol.
    6. `cargo` es siempre la función/rol que ocupa esa persona, con el organismo incluido cuando corresponda (ej. "Presidente del Instituto de Vivienda de la Ciudad de Buenos Aires"). Nunca es un nombre propio ni un título truncado sin el organismo. NUNCA incluir sus dependencias.
    7. Si el documento nombra a una persona por su cargo (ej. "el Presidente del Instituto de Vivienda, Sr. Juan Pérez"), genera UN solo destinatario: `nombre` = nombre de la persona, `cargo` = título completo incluyendo el organismo. No generes un destinatario aparte solo para el organismo en ese caso.
    8. Genera un destinatario separado para un organismo únicamente cuando el documento lo menciona como destinatario propio y distinto (ej. en una lista de notificación a otra repartición), no cuando es solo el lugar donde trabaja la persona ya extraída.
    9. Si falta nombre o cargo, devuelve `null` en ese campo. No inventes organismos, cargos ni nombres.

fields:
  numero_recomendacion: Figura como pie de página con la leyenda "Resolución Nro /<AÑO>"
    o en el nombre del archivo.
  fecha_recomendacion: Suele aparecer en el encabezado del documento (ej. "Buenos
    Aires, 01 de enero de 2000").
  destinatarios: |
    Lista de destinatarios (personas, organismos o entidades) mencionados en la resolución.
    Para cada destinatario incluir:
    - `nombre` — nombre propio o denominación institucional. NUNCA un cargo/función.
    - `cargo` — cargo/función formal completo cuando aparezca explícito, incluyendo el organismo (ej. "Presidente del Instituto de Vivienda de la Ciudad de Buenos Aires", no solo "Presidente"). NUNCA un nombre propio. NUNCA poner de que organismo depende el cargo.
    - `destinatario_principal` — true si es destinatario de la recomendación/exhortación; false si solo recibe notificación/comunicación.
    - `sector` — clasificar en uno de los siguientes sectores: GCBA (la sigla de Gobierno de la Ciudad de Buenos Aires), Organismos Nacionales, Obra Social / Prepaga, Empresa. Si no encaja en ninguno, usar null.

    Ejemplo INCORRECTO (funde a la persona con el organismo y trunca el cargo):
    {"nombre": "Instituto de Vivienda de la Ciudad Autónoma de Buenos Aires", "cargo": "Presidente", "destinatario_principal": true, "sector": "GCBA"}

    Ejemplo CORRECTO (misma situación real, nombre propio y cargo completos):
    {"nombre": "Juan Francisco Loupias", "cargo": "Presidente del Instituto de Vivienda de la Ciudad Autónoma de Buenos Aires", "destinatario_principal": true, "sector": "GCBA"}
  tema: Clasificación temática principal del documento. Elegir únicamente uno de los
    temas listados en la taxonomía.
  subtema: Clasificación temática secundaria. Elegir uno de los subtemas asociados
    al tema seleccionado en la taxonomía.
  datos_personales: Identificar si hay datos personales presentes en el documento
    (nombres, DNI, direcciones, etc.).
  contenido_para_publicar: Síntesis muy concisa (1-2 líneas) del contenido del documento,
    destacando el hecho principal y la medida adoptada. Debe mencionar de forma general
    a quién se dirige la recomendación/exhortación (`destinatario_principal=true`) y no
    debe presentar como destinatarios de la medida a quienes solo fueron notificados.
    No incluir detalles específicos que permitan identificar a las personas involucradas
    que no ejerzan cargos públicos o funciones institucionales. No mencionar datos personales
    ni detalles que puedan llevar a la identificación de personas no públicas.

taxonomy: "- DERECHOS DE LAS PERSONAS CON DISCAPACIDAD:\n  - Accesibilidad y movilidad\n\
