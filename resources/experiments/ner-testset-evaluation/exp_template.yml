experiment:
  name: "ner-testset-evaluation"
  run_name: "{backend}-{model}-{timestamp}"

data:
  format: "conll_bio" # conll_bio | hf_token_classification | span_jsonl
  input_path: "resources/data/restricted/anonymization/test.txt"
  sample_id_field: "sample_id"
  text_field: "text"
  tokens_field: "tokens"
  tags_field: "tags"
  spans_field: "spans"
  label_field: "label"
  start_field: "start"
  end_field: "end"
  # id2label:
  #   "0": "O"
  #   "1": "B-PER"
  max_samples: null
  deduplicate_by_text: true

backend:
  mode: "ner_api" # ner_api | langextract

api:
  base_url: "http://localhost:8899"
  anonymizer_predict_path: "/anonymizer/predict"
  timeout_s: 120
  retries: 2
  retry_backoff_s: 1.0
  use_cache: false

# Required when backend.mode=langextract
# langextract:
#   provider: "ollama"
#   model_id: "qwen3:8b"
#   base_url: "http://localhost:11434/v1"
#   api_key_env: "OLLAMA_API_KEY"
#   api_key_fallback: "ollama"
#   prompt_description: |
#     Extrae entidades nombradas de textos judiciales en español usando las clases definidas en los ejemplos.
#   examples_yaml_path: "resources/langextract/ner_alignment_examples.yaml"
#   temperature: 0.0
#   max_tokens: 4096
#   think: false
#   request_timeout_s: 120.0
#   retries: 2
#   retry_backoff_s: 1.0
#   max_workers: 1
#   extraction_passes: 1
#   batch_length: 1

mapping:
  labels_yaml_path: "resources/experiments/ner-langextract-alignment/label_mapping.yaml"

comparison:
  normalize_case: true
  normalize_accents: true
  normalize_punctuation: true

metrics:
  include_token_relaxed: true
  perfect_definition: "span_set_exact"

logging:
  mlflow:
    enabled: true
    tracking_uri: "http://localhost:5000"
    experiment_name: "ner-testset-evaluation"
    enable_openai_autolog: false
    request_timeout_s: 15
    request_max_retries: 2
  privacy:
    log_prompt_text: true
    log_llm_outputs: true
    log_raw_predictions: true
    redact_sensitive_fields: false

outputs:
  base_dir: "outputs/ner-testset-evaluation"
  samples_gold_jsonl: "samples_gold.jsonl"
  predictions_jsonl: "predictions.jsonl"
  per_sample_scores_jsonl: "per_sample_scores.jsonl"
  metrics_summary_json: "metrics_summary.json"
  strict_label_metrics_csv: "reports/label_metrics.csv"
  token_relaxed_confusion_csv: "reports/token_relaxed_confusion.csv"
  feedback_jsonl: "feedback/perfect_prediction.jsonl"
  traces_jsonl: "llm_traces/traces.jsonl"
  traces_summary_csv: "llm_traces/traces_summary.csv"
  manifest_json: "manifest.json"
