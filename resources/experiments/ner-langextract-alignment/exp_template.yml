experiment:
  name: "ner-langextract-alignment"
  run_name: "{model}-{timestamp}"

data:
  # input_documents_dir: "resources/data/restricted/disambiguation-eval/docs"
  # input_paragraphs_jsonl: "/workspace/data/paragraphs.jsonl"
  # input_bio_txt: "resources/outputs/synthetic-paragraph-generation/your_run_name/synthetic_samples.txt"
  input_hf_dataset: "ai4privacy/pii-masking-400k"
  input_hf_config_name: null
  input_hf_split: "train"
  input_hf_text_column: "source_text"
  input_hf_sample_id_column: "uid"
  input_hf_document_id_column: null
  input_hf_language_column: "language"
  input_hf_language_value: "es"
  input_hf_cache_dir: ".cache/huggingface"
  input_hf_clean_text: true
  input_hf_cleaning_mode: "collapse_lines"
  include_extensions: [".pdf", ".docx"]
  max_documents: 5
  max_paragraphs: 300

api:
  base_url: "http://localhost:8000"
  document_extract_path: "/misc/document-extract"
  anonymizer_predict_path: "/anonymizer/predict"
  timeout_s: 120
  retries: 2
  retry_backoff_s: 1.0
  use_cache: false

langextract:
  provider: ollama
  model_id: qwen3:8b
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_API_KEY
  api_key_fallback: ollama
  prompt_description: |
    Extrae entidades nombradas de textos judiciales en español usando las clases definidas en los ejemplos.
    Devuelve solo entidades explícitas del texto.
  examples_yaml_path: resources/langextract/ner_alignment_examples.yml
  temperature: 0.0
  think: true
  max_workers: 1
  extraction_passes: 1
  batch_length: 1

mapping:
  labels_yaml_path: "resources/experiments/ner-langextract-alignment/label_mapping.yml"

comparison:
  mode: "exact_span_label"
  normalize_case: true
  normalize_accents: true
  normalize_punctuation: true

labelstudio:
  enabled: true
  export_dir: "resources/outputs/ner-langextract-alignment"
  qa_sample_rate: 0.10
  qa_seed: 42
  # import_annotations_path: "outputs/ner-langextract-alignment/labelstudio/reviewed.json"

logging:
  mlflow:
    tracking_uri: "http://localhost:5005"
    experiment_name: "ner-langextract-alignment"
    enable_openai_autolog: false
  privacy:
    log_prompt_text: true
    log_llm_outputs: true
    log_raw_predictions: true
    redact_sensitive_fields: false

outputs:
  base_dir: "resources/outputs/ner-langextract-alignment"
  samples_jsonl: "samples.jsonl"
  traces_jsonl: "llm_traces/traces.jsonl"
  traces_summary_csv: "llm_traces/traces_summary.csv"
  train_candidates_jsonl: "train_candidates.jsonl"
  review_required_jsonl: "review_required.jsonl"
