experiment:
  name: ner-langextract-alignment
  run_name: '{model}-{timestamp}'

data:
  input_documents_dir: resources/data/restricted/disambiguation-eval/docs
  include_extensions:
  - .pdf
  - .docx

api:
  base_url: http://localhost:8000
  document_extract_path: /misc/document-extract
  anonymizer_predict_path: /anonymizer/predict
  timeout_s: 300
  retries: 2
  retry_backoff_s: 1.0
  use_cache: true

langextract:
  provider: ollama
  model_id: qwen3:8b
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_API_KEY
  api_key_fallback: ollama
  prompt_description: "    Sos un asistente especializado en el análisis de documentos\
    \ judiciales.\n    Tu tarea es identificar y extraer menciones de información\
    \ sensible para su posterior anonimización.\n    Debés detectar fragmentos textuales\
    \ que correspondan a cualquiera de las siguientes entidades:\n\n    - \"BANCO\"\
    : Nombre de una entidad bancaria, pública o privada.\n    - \"CBU\": Código Bancario\
    \ Uniforme (22 dígitos) de una cuenta.\n    - \"CORREO_ELECTRONICO\": Dirección\
    \ de correo electrónico.\n    - \"CUIJ\": Código Único de Identificación Jurídica\
    \ de causas judiciales.\n    - \"CUIT_CUIL\": Número de CUIT o CUIL de una persona\
    \ física o jurídica.\n    - \"DIRECCION\": Dirección específica (calle, número,\
    \ intersección de calles y/o avenidas, código postal, etc.).\n    - \"DNI\": Número\
    \ de Documento Nacional de Identidad u otro documento identificatorio.\n    -\
    \ \"EDAD\": Edad explícita de una persona.\n    - \"ESTUDIOS\": Nivel o institución\
    \ educativa que permita identificar a la persona (ej. \"primario incompleto\"\
    , \"secundario completo\", \"Licenciado en…\").\n    - \"FECHA\": Fecha completa\
    \ o parcial (día, mes y/o año).\n    - \"IP\": Dirección IP (IPv4 o IPv6).\n \
    \   - \"LINK\": Enlace o URL a una página web.\n    - \"LOC\": Localización geográfica\
    \ específica (país, provincia, estado, ciudad, localidad, barrio, etc.).\n   \
    \ - \"MARCA_AUTOMOVIL\": Marca de un vehículo (ej. Toyota, Ford, Suzuki, etc.).\n\
    \    - \"NACIONALIDAD\": Nacionalidad de una persona (ej. \"argentino\", \"brasileña\"\
    ).\n    - \"NOMBRE_ARCHIVO\": Nombre completo de un archivo digital (incluyendo\
    \ extensión).\n    - \"NUM_ACTUACION\": Número identificatorio de una actuación\
    \ administrativa o contravencional.\n    - \"NUM_CAJA_AHORRO\": Número completo\
    \ de una caja de ahorro o cuenta bancaria.\n    - \"NUM_EXPEDIENTE\": Número de\
    \ expediente judicial o administrativo.\n    - \"NUM_MATRICULA\": Número de matrícula\
    \ profesional o académica.\n    - \"PATENTE_DOMINIO\": Patente o dominio de un\
    \ vehículo.\n    - \"PER\": Nombre(s) y apellido(s) de una persona física. Los\
    \ nombres inicializados (ej., \"M.T.G\") y los apodos (ej., \"el Gato\") también\
    \ cuentan como información sensible a anonimizar.\n    - \"TELEFONO\": Número\
    \ telefónico (fijo o celular).\n    - \"USUARIX\": Nombre de usuario o \"handle\"\
    \ en redes sociales o plataformas digitales.\n    - \"TEXTO_ANONIMIZAR\": Comodín\
    \ para fragmento sensible libre que deba anonimizarse si no encaja claramente\
    \ en las clases anteriores."
  examples_yaml_path: resources/langextract/ner_alignment_examples.yml
  temperature: 0.0
  think: true
  max_workers: 1
  extraction_passes: 1
  batch_length: 1

mapping:
  labels_yaml_path: resources/experiments/ner-langextract-alignment/label_mapping.yml

comparison:
  mode: exact_span_label
  normalize_case: true
  normalize_accents: true
  normalize_punctuation: true

labelstudio:
  enabled: true
  export_dir: resources/outputs/ner-langextract-alignment/labelstudio
  qa_sample_rate: 1.0

logging:
  mlflow:
    tracking_uri: http://localhost:8080
    experiment_name: ner-langextract-alignment
    enable_openai_autolog: false
  privacy:
    log_prompt_text: true
    log_llm_outputs: true
    log_raw_predictions: true
    redact_sensitive_fields: false

outputs:
  base_dir: resources/outputs/ner-langextract-alignment
  samples_jsonl: samples.jsonl
  traces_jsonl: llm_traces/traces.jsonl
  traces_summary_csv: llm_traces/traces_summary.csv
  train_candidates_jsonl: train_candidates.jsonl
  review_required_jsonl: review_required.jsonl
