experiment:
  name: ner-langextract-alignment
  run_name: '{model}-{timestamp}'

data:
  # input_documents_dir: resources/data/restricted/disambiguation-eval/docs
  # input_paragraphs_jsonl: "/workspace/data/paragraphs.jsonl"
  input_bio_txt: "resources/outputs/synthetic-paragraph-generation/20260611_161248/synthetic_samples.txt" #"resources/outputs/data-augmentation/20260518_230843/augmented_train.txt"
  include_extensions:
  - .pdf
  - .docx
  max_documents: 1
  max_paragraphs: null

api:
  base_url: http://localhost:8000
  document_extract_path: /misc/document-extract
  anonymizer_predict_path: /anonymizer/predict
  timeout_s: 300
  retries: 2
  retry_backoff_s: 1.0
  use_cache: true

langextract:
  provider: ollama
  model_id: qwen3:8b
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_API_KEY
  api_key_fallback: ollama
  prompt_description: "Extrae solo informacion sensible para anonimizar en texto judicial.\nDevuelve JSON valido con esta estructura exacta:\n{\"extractions\":[{\"<CLASE>\":\"<texto>\",\"<CLASE>_attributes\":{}}]}\n\nReglas:\n- Usa solo estas clases: BANCO, CBU, CORREO_ELECTRONICO, CUIJ, CUIT_CUIL, DIRECCION, DNI, EDAD, ESTUDIOS, FECHA, IP, LINK, LOC, MARCA_AUTOMOVIL, NACIONALIDAD, NOMBRE_ARCHIVO, NUM_ACTUACION, NUM_CAJA_AHORRO, NUM_EXPEDIENTE, NUM_MATRICULA, PATENTE_DOMINIO, PER, TELEFONO, USUARIX, TEXTO_ANONIMIZAR.\n- Copia literal exacta del texto fuente.\n- Si no hay entidades, responde {\"extractions\":[]}.\n- No agregues explicaciones, markdown ni texto extra.\n- No inventes datos."
  examples_yaml_path: resources/langextract/ner_alignment_examples_compact.yml
  temperature: 0.0
  think: false
  max_workers: 1
  extraction_passes: 1
  batch_length: 1

mapping:
  labels_yaml_path: resources/experiments/ner-langextract-alignment/label_mapping.yml

comparison:
  mode: exact_span_label
  normalize_case: true
  normalize_accents: true
  normalize_punctuation: true

labelstudio:
  enabled: true
  export_dir: resources/outputs/ner-langextract-alignment/labelstudio
  qa_sample_rate: 1.0

logging:
  mlflow:
    tracking_uri: http://localhost:5005
    experiment_name: ner-langextract-alignment
    enable_openai_autolog: false
  privacy:
    log_prompt_text: true
    log_llm_outputs: true
    log_raw_predictions: true
    redact_sensitive_fields: false

outputs:
  base_dir: resources/outputs/ner-langextract-alignment
  samples_jsonl: samples.jsonl
  traces_jsonl: llm_traces/traces.jsonl
  traces_summary_csv: llm_traces/traces_summary.csv
  train_candidates_jsonl: train_candidates.jsonl
  review_required_jsonl: review_required.jsonl
