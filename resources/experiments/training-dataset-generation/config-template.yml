paths:
  train_set_path: resources/data/restricted/ner-review/labeled-dataset/train.txt
  dev_set_path: resources/data/restricted/ner-review/labeled-dataset/dev-review-cb.txt
  test_set_path: resources/data/restricted/ner-review/labeled-dataset/test-review-cb.txt
  new_candidates_path: resources/data/restricted/ner-langextract-alignment/curated/train_candidates.jsonl
  output_dir: resources/outputs/training-dataset-generation
  low_frequency_labels_path:
  run_dir_name_template: "{strategy}_{timestamp}"
  clean_labeled_filename: clean_labeled_candidates.jsonl
  clean_unlabeled_filename: clean_unlabeled_candidates.jsonl
  selected_candidates_filename: selected_candidates.jsonl
  final_bio_filename: train_generated.txt
  report_filename: report.json
  low_frequency_labels_filename: resolved_low_frequency_labels.txt

deduplication:
  internal_threshold: 95.0
  corpus_threshold: 95.0

label_selection:
  mode: all_clean_labeled
  low_frequency_top_k: 15
  min_target_labels_per_candidate: 1

unlabeled_sampling:
  mode: target_total_background_ratio
  target_background_to_labeled_ratio: 1.0
  fixed_count:

assembly:
  include_original_train: true
  shuffle_selected_candidates: true
  seed: 42
