experiment:
  name: "synthetic-paragraph-generation"
  run_name: "{model}_{timestamp}"

data:
  source_paths:
    - "resources/data/restricted/training-datasets/private/defensoria_train_candidates.txt"
    - "resources/data/restricted/training-datasets/private/j10_new_train_candidates.txt"
    - "resources/data/restricted/training-datasets/private/pj_jujuy_train_candidates.txt"
    - "resources/data/restricted/training-datasets/private/saij_train_candidates.txt"
    - "resources/data/restricted/training-datasets/private/J10-new-data/train.txt"
    - "resources/data/restricted/training-datasets/private/J10-new-data/dev.txt"
    - "resources/data/restricted/training-datasets/private/J10-new-data/test.txt"
    - "resources/data/restricted/training-datasets/public/augmented_train_candidates.txt"
    - "resources/data/restricted/training-datasets/public/cm_train_candidates.txt"
    - "resources/data/restricted/training-datasets/public/pii_train_candidates.txt"
  guidelines_path: null
  text_field: "text"
  labels_field: "final_entities"
  max_examples: 500
  examples_per_label: 3
  normalized_labels_path: notebooks/data-preparation/new-datasets/original-train-unique-labels.txt

llm:
  model: "qwen3:8b"
  keep_alive: "5m"
  num_ctx: 8192
  max_context_tokens: 8192
  reserved_output_tokens: 1024
  token_encoding_name: "cl100k_base"
  temperature: 0.5
  max_retries_per_sample: 1
  paragraphs_per_call: 3

faker:
  candidates_per_label: 5
  max_attempts_per_label: 50
  llm_only_labels:
    - "TEXTO_ANONIMIZAR"

sampling:
  target_total_synthetic: 20
  desired_target_labels:
    # - NUM_CAJA_AHORRO
    # - IP
    # - NUM_MATRICULA
    # - USUARIX
    - NOMBRE_ARCHIVO
    # - CBU
    # - ESTUDIOS
    # - CUIT_CUIL
    # - PATENTE_DOMINIO
    # - MARCA_AUTOMOVIL
    # - NACIONALIDAD
    # - BANCO
    # - CORREO_ELECTRONICO
    # - LINK
    # - EDAD
    # - TELEFONO
    # - TEXTO_ANONIMIZAR
  seed: 42

similarity:
  enabled: true
  threshold: 95.0
  internal_enabled: true
  internal_threshold: 95.0
  train_set_path: resources/data/restricted/training-datasets/private/J10-new-data/train.txt
  dev_set_path: resources/data/restricted/training-datasets/private/J10-new-data/dev.txt
  test_set_path: resources/data/restricted/training-datasets/private/J10-new-data/test.txt
  extra_bio_paths: [resources/data/restricted/training-datasets/private/defensoria_train_candidates.txt,resources/data/restricted/training-datasets/private/j10_new_train_candidates.txt,resources/data/restricted/training-datasets/private/pj_jujuy_train_candidates.txt,resources/data/restricted/training-datasets/private/saij_train_candidates.txt, resources/data/restricted/training-datasets/public/augmented_train_candidates.txt, resources/data/restricted/training-datasets/public/cm_train_candidates.txt, resources/data/restricted/training-datasets/public/pii_train_candidates.txt]

outputs:
  base_dir: "resources/outputs/synthetic-paragraph-generation"
  run_dir_name_template: "{timestamp}"
  samples_jsonl: "synthetic_samples.jsonl"
  bio_txt: "synthetic_samples.txt"
  report_json: "report.json"
  prompts_jsonl: "llm_prompts.jsonl"
  source_examples_jsonl: "source_examples.jsonl"

logging:
  mlflow:
    enabled: true
    tracking_uri: "http://localhost:5005"
    experiment_name: "synthetic-paragraph-generation"
